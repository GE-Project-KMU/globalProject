# Development TLS overlay. For an institution deployment, supply its issued
# certificate and matching server_name; do not use this local development CA.
services:
  frontend:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./scripts/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/tls:/etc/road-tls:ro
